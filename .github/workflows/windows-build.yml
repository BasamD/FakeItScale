name: Build Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test and package Windows executable
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScaleSim-1.1-Windows-x64
          path: artifacts/ScaleSim-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
